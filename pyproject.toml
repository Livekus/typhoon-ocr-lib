[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "typhoon-ocr-lib"
version = "0.1.0"
description = "Thin wrapper around Typhoon OCR with typed API and CLI."
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typhoon-ocr>=0.1.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
typhoon-ocr = "typhoon_ocr_lib.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests with fake backend",
    "e2e_real: full end-to-end tests hitting real Typhoon OCR API",
    ]
